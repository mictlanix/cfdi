[project]
name = "mictlanix-cfdi"
version = "0.1.0"
description = "Mictlanix CFDI Library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eddy Zavaleta", email = "eddy@mictlanix.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "lxml>=6.1.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mictlanix.cfdi"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-lxml>=2026.2.16",
    "xlrd>=2.0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".specify", ".claude", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
